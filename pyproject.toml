[project]
name = "linernodes"
version = "0.1.2"
description = "A CLI interface for music player, made dumber by LLMs"
readme = "README.md"
authors = [
    { name = "Matias Ceau", email = "matias@ceau.net" }
]
requires-python = ">=3.12"
dependencies = [
    "beets>=2.2.0",
    "click>=8.1.7",
    "duckdb>=1.1.3",
    "fastmcp>=2.10.6",
    "graphviz>=0.20.3",
    "musicbrainzngs>=0.7.1",
    "mutagen>=1.47.0",
    "networkx>=3.4.2",
    "plotly>=5.24.1",
    "psutil>=6.1.0",
    "python-mpd2>=3.1.1",
    "pyyaml>=6.0.2",
    "rich>=14.0.0",
    "streamlit>=1.47.0",
    "textual>=4.0.0",
    "tomli>=2.0.1",
    "tomli-w>=1.0.0",
    "uvicorn>=0.32.1",
    "vit>=2.3.2",
    "xdg>=6.0.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.12.0",
]

[project.scripts]
linernodes = "linernodes.cli.commands:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/linernodes"]
