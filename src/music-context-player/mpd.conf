    type "pulse"
    name "pulse audio"
}

audio_output {
    type "fifo"
    name "my_fifo"
    path "/tmp/mpd.fifo"
    format "44100:16:2"
}

decoder {
    plugin "hybrid_dsd"
    enabled "no"
}

replaygain "auto"
volume_normalization "yes"